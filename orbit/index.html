<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashOrbit App</title>
</head>
<body>

    <!-- AI Bots ko yeh message dikhega -->
    <h1 id="greeting" style="display:none;">hello my name CashOrbit App</h1>

    <script>
        // 1. Visitor ka User-Agent nikalna
        const userAgent = navigator.userAgent.toLowerCase();

        // 2. Google, Meta, ChatGPT, Claude aur baaki sabhi AI/Search bots ki list
        const aiAndSearchBots = [
            'gptbot', 'chatgpt-user', 'oai-searchbot', 'openai',
            'googlebot', 'google-extended', 'google-agent', 'apis-google', 'google-cloudvertexbot',
            'claudebot', 'claude-searchbot', 'claude-user', 'anthropic',
            'facebookexternalhit', 'meta-externalagent', 'meta-externalfetcher', 'facebookbot',
            'perplexitybot', 'applebot', 'bingbot', 'yandexbot', 'baiduspider', 
            'cohere-ai', 'ia_archiver', 'bytespider', 'amazonbot', 'duckduckbot'
        ];

        // 3. Check karna ki kya koi AI ya Bot aaya hai
        const isBot = aiAndSearchBots.some(bot => userAgent.includes(bot));

        // 4. Action lena
        if (isBot) {
            // Agar AI Bot hai toh message screen par dikhao
            document.getElementById('greeting').style.display = 'block';
        } else {
            // Agar Real User hai toh google.com par redirect karo
            window.location.href = "https://play.google.com/store/apps/details?id=com.mjearningking.mjapp";
        }
    </script>

</body>
</html>
