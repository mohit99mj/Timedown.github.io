<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CashOrbit - Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.mjearningking.mjapp">

    <script>
        // Instant JavaScript Redirect
        window.location.replace("https://play.google.com/store/apps/details?id=com.mjearningking.mjapp");
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #2c7be5; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2c7be5;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <h1>CashOrbit</h1>
  
    <div class="loader"></div>
    <p>Opening Play Store...</p>
    <a href="https://play.google.com/store/apps/details?id=com.mjearningking.mjapp" style="color: #2c7be5; text-decoration: none; font-weight: bold;">Click here if not redirected</a>
</div>

</body>
</html>
